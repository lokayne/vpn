name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project
        run: |
          flutter create --org app.tunnel --project-name tunnel_vpn --platforms android app
          cp main.dart app/lib/main.dart
          cd app
          flutter pub add http openvpn_flutter shared_preferences
          flutter pub get
      - name: Patch Android config
        run: |
          cd app
          # OpenVPN native libs must be extracted
          sed -i 's/<application/<application android:extractNativeLibs="true"/' android/app/src/main/AndroidManifest.xml
          # Add missing namespace to the plugin if it lacks one (needed by newer Gradle)
          P=$(ls -d $HOME/.pub-cache/hosted/pub.dev/openvpn_flutter-*/android | head -1)
          if ! grep -q namespace "$P/build.gradle"; then
            PKG=$(grep -o 'package="[^"]*"' "$P/src/main/AndroidManifest.xml" | head -1 | cut -d'"' -f2)
            sed -i "0,/android {/s//android {\n    namespace \"$PKG\"/" "$P/build.gradle"
          fi
      - name: Build release APK
        run: cd app && flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-vpn-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
